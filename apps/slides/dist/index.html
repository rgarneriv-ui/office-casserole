<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casserole Slides — vertical slice</title>
<style>
  :root { --bg: #efeef4; --panel: #ffffff; --ink: #26222e; --accent: #6b4b9e;
          --muted: #8d87a0; --line: #dfdce8; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
         background: var(--bg); color: var(--ink); height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 8px; padding: 10px 16px;
           background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .logo { font-weight: 700; } .logo em { color: var(--accent); font-style: normal; }
  button { font: inherit; font-size: 13px; padding: 5px 10px; border: 1px solid var(--line);
           background: #f9f8fc; border-radius: 6px; cursor: pointer; color: var(--ink); }
  button:hover { border-color: var(--accent); }
  .spacer { flex: 1; } #status { font-size: 12px; color: var(--muted); }
  main { flex: 1; display: flex; min-height: 0; }
  #thumbs { width: 190px; overflow-y: auto; padding: 12px; display: flex; flex-direction: column;
            gap: 10px; border-right: 1px solid var(--line); background: var(--panel); }
  .thumb { position: relative; cursor: pointer; border: 2px solid var(--line); border-radius: 6px;
           background: #fff; }
  .thumb.active { border-color: var(--accent); }
  .thumb .mini { position: relative; width: 160px; height: 90px; overflow: hidden; }
  .thumb .n { position: absolute; left: 4px; bottom: 2px; font-size: 10px; color: var(--muted); }
  .canvas-wrap { flex: 1; display: flex; flex-direction: column; align-items: center;
                 justify-content: center; padding: 20px; gap: 10px; min-width: 0; }
  #canvas { position: relative; width: min(100%, calc((100vh - 220px) * 16 / 9)); aspect-ratio: 16/9;
            background: #fff; box-shadow: 0 3px 18px rgba(38,34,46,.15); border-radius: 4px;
            overflow: hidden; touch-action: none; }
  .el { position: absolute; }
  .el.text .t { width: 100%; height: 100%; overflow: hidden; line-height: 1.25; white-space: pre-wrap; }
  .el.rect { border-radius: 4px; }
  .el.image img { width: 100%; height: 100%; object-fit: fill; display: block; pointer-events: none; }
  #canvas .el { cursor: move; }
  #canvas .el.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
  .handle { position: absolute; right: -7px; bottom: -7px; width: 12px; height: 12px;
            background: var(--accent); border-radius: 3px; cursor: nwse-resize; }
  .edit-overlay { position: absolute; z-index: 10; border: 2px solid var(--accent); border-radius: 2px;
                  background: rgba(255,255,255,.96); resize: none; padding: 0; margin: 0;
                  font-family: inherit; line-height: 1.25; outline: none; box-sizing: border-box; }
  #props { display: flex; gap: 14px; align-items: center; background: var(--panel);
           border: 1px solid var(--line); border-radius: 8px; padding: 6px 14px; font-size: 13px;
           min-height: 38px; flex-wrap: wrap; }
  #props label { display: flex; gap: 5px; align-items: center; }
  .z-group { display: flex; gap: 4px; margin-left: auto; }
  .z-group button { font-size: 12px; padding: 3px 7px; }
  #props input[type=number] { width: 60px; }
  #props .hint { color: var(--muted); }
  #present { position: fixed; inset: 0; background: #111; display: flex; align-items: center;
             justify-content: center; z-index: 50; cursor: pointer; }
  #present .stage { position: relative; background: #fff; overflow: hidden; }
  #present .counter { position: fixed; right: 16px; bottom: 12px; color: #999; font-size: 13px; }
  .el.line svg { display: block; overflow: visible; }
  .el.line { background: transparent; }
</style>
</head>
<body>
  <div id="ribbon"></div>
  <header>
    <span class="logo">Casserole <em>Slides</em></span>
    <button id="btn-add-slide" title="New slide">+ Slide</button>
    <button id="btn-dup-slide" title="Duplicate slide">⧉</button>
    <button id="btn-del-slide" title="Delete slide">− Slide</button>
    <button id="btn-add-text" title="Add text box">+ Text</button>
    <button id="btn-add-rect" title="Add box">+ Box</button>
    <button id="btn-add-image" title="Insert image from file">+ Image</button>
    <button id="btn-add-line" title="Add line/connector">+ Line</button>
    <input id="image-open" type="file" accept="image/png,image/jpeg,image/gif" style="display:none" />
    <button id="btn-del-el" title="Delete selected element (Del)">Delete el.</button>
    <button id="btn-undo" title="Undo (Ctrl/Cmd-Z)">↶</button>
    <button id="btn-redo" title="Redo (Ctrl/Cmd-Y)">↷</button>
    <button id="btn-present" title="Present (Esc to exit)">▶ Present</button>
    <button id="btn-open" title="Open a .pptx or .json deck">Open…</button>
    <input id="file-open" type="file" accept=".pptx,.json" style="display:none" />
    <button id="btn-export-pptx" title="Export PowerPoint (.pptx)">↓ PPTX</button>
    <button id="btn-export-json" title="Export native JSON">↓ JSON</button>
    <span class="spacer"></span>
    <span id="status">Ready</span>
  </header>
  <main>
    <div id="thumbs"></div>
    <div class="canvas-wrap">
      <div id="canvas"></div>
      <div id="props"></div>
    </div>
  </main>
  <div id="present" hidden><div class="stage"></div><span class="counter"></span></div>
  <script src="bundle.js"></script>
</body>
</html>
